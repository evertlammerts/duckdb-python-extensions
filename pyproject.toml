[project]
name = "duckdb-extension-wheel"
version = "0.1.0"
description = "Build pip wheels from DuckDB extension binaries"
readme = "PROTOCOL.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["duckdb", "extension", "wheel"]

[project.urls]
Source = "https://github.com/duckdb/duckdb-python-extensions"
Status = "https://duckdb.github.io/duckdb-python-extensions/"

[project.scripts]
duckdb-extension-wheel = "duckdb_extension_wheel.cli:main"

[dependency-groups]
test = ["pytest", "pytest-cov"]

[tool.coverage.run]
source = ["duckdb_extensions", "duckdb_extension_wheel", "build_extension_wheels", "plan_wheels", "test_installed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["network: downloads DuckDB binaries and CLIs; runs only with DUCKDB_EXTENSION_WHEEL_NETWORK=1"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "duckdb_extension_wheel"
